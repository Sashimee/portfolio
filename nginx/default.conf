# Compression et durées de cache — les deux manquaient, et leur absence se
# mesurait : la feuille de style sortait en 299 564 octets bruts, sans
# `content-encoding` ni `cache-control`, revalidée à chaque visite.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Derrière un proxy qui termine TLS, $scheme vaut `http` : une redirection
    # absolue renverrait donc le visiteur — et le moissonneur — sur un saut en
    # clair avant de revenir en HTTPS. Relatif, le navigateur garde le schéma.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Par défaut : revalider. Le document d'entrée et les instantanés de route
    # portent le nom de la construction qui les a produits, pas une empreinte —
    # les mettre en cache ferait qu'un déploiement correct semble sans effet.
    add_header Cache-Control "no-cache";

    # Vite hache le nom de chaque fichier de ce dossier : un contenu qui change
    # change d'adresse, donc celle-ci ne périme jamais.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Captures, icônes et démos : désignées par un nom stable, donc gardées un
    # jour seulement — une image remplacée doit pouvoir apparaître le lendemain.
    location ~* ^/(screenshots|icons)/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # 27 652 octets qu'aucun `location` ne rattrapait : la favicone tombait sur
    # le `no-cache` par défaut et se revalidait à chaque navigation.
    location = /favicon.ico {
        add_header Cache-Control "public, max-age=86400";
    }

    # L'adresse que le blog portait quand il n'avait qu'un article. Elle est
    # indexée et partagée, et `routes.js` la redirige — mais côté navigateur
    # seulement : un moissonneur y recevait l'instantané de l'accueil, en 200,
    # canonique vers `/`. Le signal de l'ancienne adresse partait donc sur
    # l'accueil au lieu de l'article.
    location = /blog/article {
        return 301 /blog/green-coding-fintech;
    }

    # Les démos sont servies telles quelles, avec le balisage de leur gabarit
    # d'origine : pas de canonique, des titres comme « Document ». `robots.txt`
    # les exclut ; cet en-tête le dit aussi à qui ne le lit pas.
    location /projects_folder/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex";
    }

    # `$uri/index.html` AVANT `$uri/` : sur `$uri/` seul, NGINX répond 301 vers
    # l'adresse à barre finale, et c'est l'adresse SANS barre que publient le
    # plan du site et la balise canonique. Chacune des quatorze routes
    # pré-rendues répondait donc 301 sur la seule adresse qu'elle déclare, vers
    # une page dont la canonique désigne l'autre. L'instantané est servi
    # directement, en 200, à l'adresse annoncée.
    #
    # `=404` en dernier, et non `/index.html` : la retombée sur l'accueil
    # répondait 200 à `/projects/jeanne` avec le titre et la canonique de
    # l'accueil, la 404 n'existant que côté client, après hydratation. Chaque
    # faute de frappe devenait un duplicata de l'accueil. Toutes les routes de
    # l'application sont pré-rendues — `test/pre-rendu.spec.js` le vérifie, pour
    # qu'une route ajoutée sans instantané échoue ici plutôt qu'en production.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Le document d'erreur est l'application, augmentée des balises de la page
    # 404 et d'un `noindex` : le visiteur voit la vraie page, le moissonneur
    # reçoit le statut 404.
    error_page 404 /404.html;

    # `internal` : l'instantané ne répond qu'à travers `error_page`. Servi
    # directement, il serait une page de plus, en 200.
    location = /404.html {
        internal;
    }
}
