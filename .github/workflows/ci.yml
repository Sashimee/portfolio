name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # L'hôte de l'API n'existe qu'après la construction, et son absence ne
      # casse rien de visible : le formulaire posterait sur l'origine du site.
      - run: npm run verify:api-url

      - uses: actions/upload-artifact@v4
        with:
          name: dist-spa
          path: dist/spa
          retention-days: 7

  # Le service de courriel est un second déployable, avec ses propres
  # dépendances : il a sa propre porte. Le lint, lui, reste celui de la racine —
  # son glob couvre ./service/**/*.js.
  mail:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: service/mail

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: service/mail/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Construire l'image
        run: docker build -t portfolio-mail .
